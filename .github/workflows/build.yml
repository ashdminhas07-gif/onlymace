name: Build OnlyMace
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: OnlyMace-1.0.1
          path: target/OnlyMace-1.0.1.jar
